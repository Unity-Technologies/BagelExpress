<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bagel Express app icon: Begu-chan on a honey-yellow starburst. Vector only, like the rest of the game:
       Unity's SVG importer rasterizes it to a 1024x1024 texture (svgType 2) for Player Settings > Icon.
       Full bleed and opaque, as iOS expects; the face stays inside the area its rounded corners keep. -->
  <defs>
    <radialGradient id="sky" cx="512" cy="600" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D2"/>
      <stop offset="0.5" stop-color="#FFD66E"/>
      <stop offset="1" stop-color="#F5A623"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="330" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EBA65E"/>
      <stop offset="0.55" stop-color="#D0843F"/>
      <stop offset="1" stop-color="#A8592A"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="330" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6C27A"/>
      <stop offset="1" stop-color="#DA9048"/>
    </linearGradient>
  </defs>

  <!-- Sky and starburst: honey yellow, 10 long and 10 short slender diamonds of irregular lengths around Begu-chan (the
       game's Starburst element). Never wedge rays that widen to the edges: those can read as the Rising Sun Flag. -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <path fill="#FFFFFF" fill-opacity="0.32" d="M512.0 507.8 L484.7 383.5 L512.0 3.7 L539.3 383.5 Z M566.2 525.4 L617.5 408.2 L864.2 115.2 L661.9 440.4 Z M599.6 571.5 L740.4 492.5 L1209.4 373.4 L760.0 552.7 Z M599.6 628.5 L756.6 646.7 L1196.3 822.3 L737.3 706.0 Z M566.2 674.6 L686.8 786.1 L949.7 1202.4 L635.0 823.7 Z M512.0 692.2 L540.6 826.7 L512.0 1237.6 L483.4 826.7 Z M457.8 674.6 L386.0 829.1 L59.8 1222.4 L333.0 790.6 Z M424.4 628.5 L303.9 697.9 L-99.9 798.8 L286.1 643.1 Z M424.4 571.5 L250.9 550.2 L-236.2 356.9 L271.5 486.8 Z M457.8 525.4 L333.6 410.0 L61.8 -19.6 L386.5 371.6 Z"/>
  <path fill="#FFFFFF" fill-opacity="0.22" d="M540.5 512.4 L547.1 415.8 L658.3 149.7 L591.8 430.3 Z M586.6 545.8 L645.0 475.1 L878.9 333.5 L671.9 512.1 Z M604.2 600.0 L697.3 576.6 L982.6 600.0 L697.3 623.4 Z M586.6 654.2 L642.2 671.6 L769.1 786.8 L620.3 701.7 Z M540.5 687.6 L580.5 745.7 L625.5 949.5 L542.2 758.1 Z M483.5 687.6 L483.0 752.3 L405.8 926.7 L446.0 740.3 Z M437.4 654.2 L400.7 704.5 L241.8 796.3 L378.3 673.5 Z M419.8 600.0 L336.0 622.2 L78.8 600.0 L336.0 577.8 Z M437.4 545.8 L348.0 509.9 L130.1 322.6 L375.6 471.9 Z M483.5 512.4 L437.6 442.0 L381.6 198.6 L479.3 428.5 Z"/>

  <!-- Begu-chan, at 86% around the body's center, with more of the starburst around. -->
  <g transform="translate(512 600) scale(0.86) translate(-512 -600)">

  <!-- Feet and arms (behind the body) -->
  <g fill="#3B1F14">
    <ellipse cx="418" cy="872" rx="66" ry="40"/>
    <ellipse cx="606" cy="872" rx="66" ry="40"/>
    <ellipse cx="176" cy="650" rx="52" ry="64" transform="rotate(-18 176 650)"/>
    <ellipse cx="848" cy="650" rx="52" ry="64" transform="rotate(18 848 650)"/>
  </g>

  <!-- Body: ink outline, crust, the lighter top surface, a gloss -->
  <ellipse cx="512" cy="600" rx="346" ry="292" fill="#3B1F14"/>
  <ellipse cx="512" cy="600" rx="330" ry="276" fill="url(#crust)"/>
  <ellipse cx="512" cy="468" rx="286" ry="150" fill="url(#top)"/>
  <ellipse cx="400" cy="400" rx="96" ry="34" fill="#FFFFFF" fill-opacity="0.32" transform="rotate(-14 400 400)"/>

  <!-- The hole -->
  <ellipse cx="512" cy="448" rx="98" ry="44" fill="#3B1F14"/>
  <ellipse cx="512" cy="456" rx="80" ry="30" fill="#7A4220"/>

  <!-- Sesame seeds -->
  <g fill="#FFF6DC" stroke="#3B1F14" stroke-width="6">
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(360 420) rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(430 380) rotate(-8)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(600 382) rotate(12)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(668 418) rotate(28)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(318 488) rotate(-40)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(712 490) rotate(40)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(392 520) rotate(15)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(636 524) rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(512 360) rotate(0)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(470 528) rotate(-5)"/>
    <ellipse cx="0" cy="0" rx="21" ry="11" transform="translate(556 530) rotate(8)"/>
  </g>

  <!-- Face: sparkle eyes, blush, open smile -->
  <g fill="#3B1F14">
    <circle cx="398" cy="664" r="64"/>
    <circle cx="626" cy="664" r="64"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M390 612 Q401.2 640.8 430 652 Q401.2 663.2 390 692 Q378.8 663.2 350 652 Q378.8 640.8 390 612 Z"/>
    <path d="M618 612 Q629.2 640.8 658 652 Q629.2 663.2 618 692 Q606.8 663.2 578 652 Q606.8 640.8 618 612 Z"/>
    <circle cx="424" cy="694" r="11"/>
    <circle cx="652" cy="694" r="11"/>
  </g>
  <g fill="#FF8EA2" fill-opacity="0.75">
    <ellipse cx="300" cy="734" rx="48" ry="28"/>
    <ellipse cx="724" cy="734" rx="48" ry="28"/>
  </g>
  <path d="M456 712 Q512 714 568 712 Q566 802 512 806 Q458 802 456 712 Z" fill="#3B1F14"/>
  <path d="M476 778 Q512 752 548 778 Q536 798 512 800 Q488 798 476 778 Z" fill="#FF7A8E"/>

  <!-- Maple leaf accessory -->
  <g transform="translate(756 318) rotate(22) scale(1.18)">
    <path d="M0 -100 L18 -62 L42 -74 L36 -36 L86 -46 L72 -18 L98 2 L50 22 L56 42 L10 34 L6 62 L-6 62 L-10 34 L-56 42 L-50 22 L-98 2 L-72 -18 L-86 -46 L-36 -36 L-42 -74 L-18 -62 Z" fill="#E8452C" stroke="#3B1F14" stroke-width="9" stroke-linejoin="round"/>
    <path d="M0 58 L0 -70 M0 -6 L52 -30 M0 -6 L-52 -30 M0 22 L34 22 M0 22 L-34 22" fill="none" stroke="#FF8A70" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" stroke="#3B1F14" stroke-width="8" stroke-linejoin="round">
    <path d="M214 244 Q229.7 284.3 270 300 Q229.7 315.7 214 356 Q198.3 315.7 158 300 Q198.3 284.3 214 244 Z"/>
    <path d="M880 490 Q888.4 511.6 910 520 Q888.4 528.4 880 550 Q871.6 528.4 850 520 Q871.6 511.6 880 490 Z"/>
  </g>
  </g>
</svg>
